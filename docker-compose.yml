# =============================================================================
# Gov Connect — Composición base (modo "prod-like")
# =============================================================================
# Este archivo define el estado estable de los servicios. El frontend se sirve
# ya COMPILADO con nginx y el backend corre el JAR (imagen slim).
#
#   Arranque "prod-like" (sin hot reload):
#     docker compose -f docker-compose.yml up --build
#
#   Arranque en DESARROLLO (Vite HMR + Spring DevTools):
#     docker compose up --build
#   → Compose carga automáticamente docker-compose.override.yml, que sobreescribe
#     backend y frontend con bind mounts y live reload.
#
# Variables de entorno: se leen del archivo `.env` en la raíz (ver .env.example).
# =============================================================================

name: gov-connect

# ── Red interna ──────────────────────────────────────────────────────────────
# Los servicios se comunican por su NOMBRE de servicio (`db`, `backend`, …).
# Solo se publican al host los puertos explícitamente mapeados en `ports`.
networks:
  govconnect:
    driver: bridge

# ── Volúmenes nombrados ──────────────────────────────────────────────────────
volumes:
  # Persistencia de SQL Server: sobrevive a `docker compose down`.
  sqlserver-data:

services:
  # ── Base de datos operacional (SQL Server) ─────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: govconnect-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD no está definida en .env}
      MSSQL_PID: Developer
    ports:
      # Expuesto al host para conectar SSMS / Azure Data Studio en local.
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - govconnect
    healthcheck:
      # SQL Server arranca lento (~30-60 s); el healthcheck solo se usa para
      # encadenar depends_on. `-C` confía en el certificado autofirmado.
      # Se prueba con dos rutas posibles de sqlcmd por compatibilidad entre
      # versiones de la imagen (tools18 / tools).
      test:
        - CMD-SHELL
        - (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1) || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Inicializador one-shot: esquema + migraciones + datos demo ────────────
  # Ejecuta los scripts SQL una vez y termina. El backend espera a que este
  # contenedor complete (service_completed_successfully) antes de arrancar.
  #
  # Reutiliza la misma imagen que `db` (mcr.microsoft.com/mssql/server), que ya
  # incluye sqlcmd en /opt/mssql-tools18/bin/sqlcmd. La imagen dedicada
  # `mcr.microsoft.com/mssql-tools:18` NO existe/deprecada, por eso se evita.
  # Se sobrescribe el entrypoint para que, en lugar de arrancar SQL Server,
  # ejecute init.sh.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: govconnect-db-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD no está definida en .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      DB_HOST: db
      DB_PORT: "1433"
    volumes:
      - ./database:/database:ro
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["/docker-entrypoint-initdb.d/init.sh"]
    networks:
      - govconnect

  # ── Backend (Spring Boot / Java 21) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govconnect-backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      # Perfil de Spring (ver .env.example). Para local se recomienda `dev`.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      # SQL Server: dentro de la red de Docker el host es el servicio `db`.
      GOVCONNECT_DB_URL: jdbc:sqlserver://db:1433;databaseName=GOV_CONNECT_DB;encrypt=true;trustServerCertificate=true
      GOVCONNECT_DB_USERNAME: sa
      GOVCONNECT_DB_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD no está definida en .env}
      # JWT (obligatorio)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET no está definida en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      # CORS: los orígenes del navegador (no los nombres de red de Docker).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}
      # Cookies / Swagger
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # DuckDB y ETL (rutas relativas al CWD /app del contenedor)
      DUCKDB_PATH: ${DUCKDB_PATH:-database/analytics/analytics.duckdb}
      ETL_EXPORT_DIR: ${ETL_EXPORT_DIR:-exports}
      # SMTP (vacío => la alerta registra el fallo sin detenerse)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # Alerta de contratos por vencer
      ALERT_EXPIRING_ENABLED: ${ALERT_EXPIRING_ENABLED:-true}
      ALERT_EXPIRING_RECIPIENTS: ${ALERT_EXPIRING_RECIPIENTS:-}
      ALERT_EXPIRING_DAYS: ${ALERT_EXPIRING_DAYS:-30}
      ALERT_EXPIRING_FROM: ${ALERT_EXPIRING_FROM:-no-reply@govconnect.com}
      ALERT_EXPIRING_CRON: ${ALERT_EXPIRING_CRON:-0 0 7 * * MON-FRI}
      # Subida de archivos
      MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-50MB}
      MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-55MB}
    ports:
      - "8080:8080"
    networks:
      - govconnect
    healthcheck:
      # /actuator/health exige autenticación (SecurityConfig.anyRequest), así
      # que responde 401 una vez Spring arrancó. 200 o 401 = "vivo".
      test:
        - CMD-SHELL
        - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health | grep -qE '200|401'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Frontend (SPA compilado + nginx) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El navegador —no Docker— resuelve esta URL, por eso apunta a localhost.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: govconnect-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - govconnect
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:80/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
