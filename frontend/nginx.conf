# =============================================================================
# Gov Connect — nginx (servidor del SPA + proxy al backend)
# =============================================================================
# - try_files ... /index.html habilita el enrutado de React Router (SPA): al
#   recargar /analytics, nginx devuelve index.html en lugar de un 404.
# - /api/ se proxea al servicio `backend` (nombre de red en docker compose);
#   útil si en producción se quiere un único origen. En local el navegador
#   también puede ir directo a http://localhost:8080/api/v1.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API: proxy hacia el backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache ────────────────────────────────────────────────────────────────
    # index.html nunca se cachea (lleva las referencias a los bundles).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets con hash en el nombre (main.abc123.js, assets/...) se cachean
    # agresivamente porque su nombre cambia en cada build.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
