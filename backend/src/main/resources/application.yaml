# =============================================================================
# Gov Connect — Configuración base (compartida por todos los perfiles)
# =============================================================================
# Valores por defecto seguros para producción. El perfil `dev` sobreescribe
# lo necesario para desarrollo local.
#
# Perfiles activos:
#   Desarrollo:  SPRING_PROFILES_ACTIVE=dev  (o --spring.profiles.active=dev)
#   Producción:   SPRING_PROFILES_ACTIVE=prod (o --spring.profiles.active=prod)
#   Sin perfil:   se aplican solo los valores de este archivo.
# =============================================================================

server:
  # PORT es la variable que inyectan las plataformas PaaS (Render, Heroku…) y
  # tiene prioridad. SERVER_PORT sigue funcionando para desarrollo local.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    primary:
      jdbc-url: ${GOVCONNECT_DB_URL}
      username: ${GOVCONNECT_DB_USERNAME}
      password: ${GOVCONNECT_DB_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    # show-sql y format_sql se activan solo en perfil dev
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── Correo (alerta de contratos por vencer) ──────────
  # El host vacío significa "SMTP no configurado": la alerta registra el error
  # en automation_logs sin detener la aplicación.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  # ── Subida de archivos (ingesta CSV) ────────────────
  # Límites configurables por entorno. El default de Spring es 10 MB, insuficiente
  # para export de SECOP II de gran volumen.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:55MB}

management:
  endpoints:
    web:
      exposure:
        include: health, info

# ── Swagger ─────────────────────────────────────────
swagger:
  enabled: ${SWAGGER_ENABLED:true}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

# ── DuckDB (base analítica embebida) ──────────────────
duckdb:
  path: ${DUCKDB_PATH:database/analytics/analytics.duckdb}

# ── ETL ──────────────────────────────────────────────
etl:
  export-dir: ${ETL_EXPORT_DIR:exports}

# ── JWT ────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

# ── Cookies de sesión ──────────────────────────────
app:
  # true => cookies marcadas Secure (solo se envían por HTTPS).
  # Debe ser true en producción.
  cookie-secure: ${COOKIE_SECURE:false}

  # ── CORS ───────────────────────────────────────────────
  # Orígenes autorizados, separados por coma. El default cubre el frontend
  # local (Vite). En producción hay que declarar el dominio del frontend
  # desplegado; de lo contrario el navegador bloquea todas las peticiones.
  # No se admite "*": allowCredentials está activo por las cookies de sesión.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  # ── Alerta de contratos por vencer ─────────────────────
  alert:
    expiring-contracts:
      # true => habilita la alerta automática programada.
      enabled: ${ALERT_EXPIRING_ENABLED:true}
      # Destinatarios separados por coma.
      recipients: ${ALERT_EXPIRING_RECIPIENTS:}
      # Ventana de días para considerar un contrato "por vencer".
      days: ${ALERT_EXPIRING_DAYS:30}
      from: ${ALERT_EXPIRING_FROM:no-reply@govconnect.com}
      # Programación (cron Spring): de lunes a viernes a las 7:00 AM.
      cron: ${ALERT_EXPIRING_CRON:0 0 7 * * MON-FRI}

# ── Logging base (sobreescribible por perfil) ────────
logging:
  level:
    root: INFO
    com.govconnect: INFO
