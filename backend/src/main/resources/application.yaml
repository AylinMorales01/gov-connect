server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    primary:
      jdbc-url: ${GOVCONNECT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GOV_CONNECT_DB;encrypt=true;trustServerCertificate=true}
      username: ${GOVCONNECT_DB_USERNAME:sa}
      password: ${GOVCONNECT_DB_PASSWORD:}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
